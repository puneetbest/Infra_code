name:  Terraform CI

on:
  workflow_dispatch:

  push:
    branches:
      - feature/aks

  # Run CI again for the Pull Request to main
  # This provides the required GitHub status check
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  terraform-ci:
    name: Security, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environment

    steps:

      # ===================================================
      # 1. Checkout
      # ===================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===================================================
      # 2. Secret Scanning - Gitleaks
      # ===================================================
      - name: Secret Scan - Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===================================================
      # 3. IaC Security Scan - tfsec
      # ===================================================
      - name: IaC Scan - tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environment
          soft_fail: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===================================================
      # 4. Setup Terraform
      # ===================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ===================================================
      # 5. Terraform Format Check
      # ===================================================
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ===================================================
      # 6. Azure Login
      # ===================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ea616115-2b4d-47c6-a3d4-e08f76c012c2
          tenant-id: 5b1021f9-49ca-4cb6-8817-704d0960a2b9
          subscription-id: b3cee294-daf0-4add-80fd-af9b8c01c64a

      # ===================================================
      # 7. Terraform Init
      # ===================================================
      - name: Terraform Init
        run: terraform init

      # ===================================================
      # 8. Terraform Validate
      # ===================================================
      - name: Terraform Validate
        run: terraform validate

      # ===================================================
      # 9. Terraform Plan
      # ===================================================
      - name: Terraform Plan
        env:
          TF_VAR_ssh_public_key: ${{ secrets.AZURE_VM_SSH_PUBLIC_KEY }}
        run: terraform plan
